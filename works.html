<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Works — Sangkeyong Kim</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/style_works.css" />
  
  <link href="https://fonts.googleapis.com/css2?family=Yarndings+12&display=swap" rel="stylesheet" />
	<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Buda:wght@300&display=swap" rel="stylesheet" />

</head>
<body>

  <section class="works-section" id="works">

    <div class="works-sticky">

      <!-- HUD: 레이블 + 카운터 + 홈 -->
      <div class="works-hud">
        <div class="works-hud__left">
          <!--<p class="works-hud__label">Selected Works</p>-->
          <div class="works-hud__progress">
            <span class="works-hud__current" id="hud-current">01</span>
            <div class="works-hud__bar">
              <div class="works-hud__fill" id="hud-fill"></div>
            </div>
            <span class="works-hud__total">05</span>
          </div>
        </div>
        
      </div>

      <!-- 카드 트랙 -->
      <div class="works-track" id="works-track">

        <div class="works-card" data-index="0">
          <a href="project-1.html" class="works-card__inner">
            <div class="works-card__media" style="background:#262626;">
              <img src="https://res.cloudinary.com/dzayipaad/image/upload/v1778771415/Slide_4_3_-_120_2_kdcaj0.png" alt="참기름 가게 리브랜딩">
              <div class="works-card__overlay"></div>
            </div>
            <div class="works-card__body">
              <div class="works-card__top">
                <div class="works-card__meta">
                  <span class="works-card__cat">Brand Identity</span>
                  <span class="works-card__sep">|</span>
                  <span class="works-card__year">2025</span>
                </div>
                <div class="works-card__arrow">↗</div>
              </div>
              <div class="works-card__bottom">
                <h2 class="works-card__title">참기름 가게<br>리브랜딩</h2>
              </div>
              <span class="works-card__num">01</span>
            </div>
          </a>
        </div>

        <div class="works-card" data-index="1">
          <a href="project-2.html" class="works-card__inner">
            <div class="works-card__media" style="background:#404040;">
              <img src="https://res.cloudinary.com/dzayipaad/image/upload/v1778203679/%ED%8F%B0%ED%8A%B8_%EC%9D%BC%EB%9F%AC%EB%A1%9C_%EC%9E%91%EC%97%85_0202020_%EB%B3%B5%EA%B5%AC%EB%90%A8_11SSDSD_%EB%8C%80%EC%A7%80_7_hpfhil.png" alt="타밀어-영어 폰트 디자인">
              <div class="works-card__overlay"></div>
            </div>
            <div class="works-card__body">
              <div class="works-card__top">
                <div class="works-card__meta">
                  <span class="works-card__cat">Type Design</span>
                  <span class="works-card__sep">|</span>
                  <span class="works-card__year">2025</span>
                </div>
                <div class="works-card__arrow">↗</div>
              </div>
              <div class="works-card__bottom">
                <h2 class="works-card__title">타밀어-영어<br>폰트 디자인</h2>
              </div>
              <span class="works-card__num">02</span>
            </div>
          </a>
        </div>

        <div class="works-card" data-index="2">
          <a href="project-3.html" class="works-card__inner">
            <div class="works-card__media" style="background:#525252;">
              <img src="https://res.cloudinary.com/dzayipaad/image/upload/v1778781758/Slide_4_3_-_121_1_r4ms7u.png">
              <div class="works-card__overlay"></div>
            </div>
            <div class="works-card__body">
              <div class="works-card__top">
                <div class="works-card__meta">
                  <span class="works-card__cat">Type Design</span>
                  <span class="works-card__sep">|</span>
                  <span class="works-card__year">2025</span>
                </div>
                <div class="works-card__arrow">↗</div>
              </div>
              <div class="works-card__bottom">
                <h2 class="works-card__title">인도 음식점<br>한글 레터링</h2>
              </div>
              <span class="works-card__num">03</span>
            </div>
          </a>
        </div>

        <div class="works-card" data-index="3">
          <a href="project-4.html" class="works-card__inner">
            <div class="works-card__media" style="background:#737373;">
              <img src="https://res.cloudinary.com/dzayipaad/image/upload/v1778779394/ChatGPT_Image_May_15_2026_02_21_38_AM_xcqtta.png">
              <div class="works-card__overlay"></div>
            </div>
            <div class="works-card__body">
              <div class="works-card__top">
                <div class="works-card__meta">
                  <span class="works-card__cat">Prodect Design</span>
                  <span class="works-card__sep">|</span>
                  <span class="works-card__year">2025</span>
                </div>
                <div class="works-card__arrow">↗</div>
              </div>
              <div class="works-card__bottom">
                <h2 class="works-card__title">플로어<br>스탠드 디자인</h2>
              </div>
              <span class="works-card__num">04</span>
            </div>
          </a>
        </div>

        <div class="works-card" data-index="4">
          <a href="project-5.html" class="works-card__inner">
            <div class="works-card__media" style="background:#3f3f46;">
              <img src="https://res.cloudinary.com/dzayipaad/image/upload/v1778776784/Slide_4_3_-_121_w5gx01.png">
              <div class="works-card__overlay"></div>
            </div>
            <div class="works-card__body">
              <div class="works-card__top">
                <div class="works-card__meta">
                  <span class="works-card__cat">Editorial Design</span>
                  <span class="works-card__sep">|</span>
                  <span class="works-card__year">2024</span>
                </div>
                <div class="works-card__arrow">↗</div>
              </div>
              <div class="works-card__bottom">
                <h2 class="works-card__title">Y2K<br>편집 디자인</h2>
              </div>
              <span class="works-card__num">05</span>
            </div>
          </a>
        </div>

      </div><!-- /works-track -->

      <p class="works-hint" id="works-hint">scroll to explore ↓</p>

    </div><!-- /works-sticky -->

  </section>

  <script src="js/components.js"></script>
  <script src="js/script_works.js"></script>
</body>
</html>
